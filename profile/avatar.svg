<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-labelledby="t">
  <title id="t">Photo placeholder: replace profile/avatar.svg with your picture</title>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0B1120"/>
    </radialGradient>
    <clipPath id="c"><circle cx="200" cy="200" r="184"/></clipPath>
  </defs>
  <circle cx="200" cy="200" r="196" fill="none" stroke="url(#ring)" stroke-width="8">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="200" r="184" fill="url(#bg)"/>
  <g clip-path="url(#c)" fill="#334155">
    <circle cx="200" cy="165" r="62"/>
    <ellipse cx="200" cy="340" rx="118" ry="96"/>
  </g>
  <text x="200" y="300" text-anchor="middle" font-family="Segoe UI, Ubuntu, sans-serif" font-size="22" font-weight="700" fill="#E2E8F0" letter-spacing="3">YOUR PHOTO</text>
  <text x="200" y="328" text-anchor="middle" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14" fill="#94A3B8">profile/avatar.png</text>
</svg>
